name: Cek app live
on:
  schedule:
    - cron: "41 */6 * * *"   # setiap 6 jam: jaga app tetap bangun & pastikan halaman login sehat
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04   # Playwright belum mendukung Ubuntu 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keepalive.py
